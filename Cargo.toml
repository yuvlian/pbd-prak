[package]
name = "pbd-prak"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

actix-files = "0.7.2"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.18.1"
actix-ws = "0.4.0"

bcrypt = "0.19.3"

dotenvy = "0.15.7"

futures-util = "0.3.34"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

sqlx = { version = "0.9.0", features = ["chrono", "macros", "migrate", "mysql", "mysql-rsa", "runtime-tokio"] }

thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = { version = "0.4.45", features = ["serde"] }
